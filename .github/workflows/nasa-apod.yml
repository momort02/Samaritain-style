name: Mettre a jour NASA APOD

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-apod:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Recuperer l image NASA du jour
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          curl --fail --silent --show-error \
            "https://api.nasa.gov/planetary/apod?api_key=${NASA_API_KEY}" \
            -o nasa-apod.json

      - name: Publier le JSON NASA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nasa-apod.json
          git diff --cached --quiet || git commit -m "chore: update NASA APOD"
          git push
