<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMARITAN // REAL-TIME SYSTEM TELEMETRY</title>
  <style>
    :root {
      --bg: #ffffff;
      --primary: #000000;
      --alert: #ff0000;
      --muted: #777777;
      --grid: rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--primary);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
      cursor: crosshair;
      transition: background-color 0.3s, color 0.3s;
    }

    body.theme-red {
      --bg: #100000;
      --primary: #ff0000;
      --muted: #880000;
      --grid: rgba(255, 0, 0, 0.1);
    }

    body.theme-green {
      --bg: #001000;
      --primary: #00ff66;
      --muted: #118844;
      --grid: rgba(0, 255, 102, 0.1);
    }

    body.theme-amber {
      --bg: #100a00;
      --primary: #ffb000;
      --muted: #886000;
      --grid: rgba(255, 176, 0, 0.1);
    }

    body.theme-blue {
      --bg: #00060f;
      --primary: #33aaff;
      --muted: #1a5580;
      --grid: rgba(51, 170, 255, 0.1);
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.7rem;
      font-weight: 800;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 12px;
      z-index: 3;
    }

    .header-group {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background-color: var(--primary);
      color: var(--bg);
      padding: 3px 8px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.alert {
      background-color: var(--alert);
      color: #ffffff;
    }

    main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 3;
      padding: 20px 0;
      width: 100%;
      flex-grow: 1;
    }

    .sub-status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 700;
      text-align: center;
    }

    .text-display {
      font-size: clamp(1.2rem, 5vw, 2.6rem);
      font-weight: 900;
      text-align: center;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      word-break: break-word;
    }

    .cursor {
      display: inline-block;
      width: clamp(8px, 2vw, 16px);
      height: clamp(1.2rem, 5vw, 2.6rem);
      background-color: var(--primary);
      margin-left: 6px;
      animation: blink 0.6s infinite;
      flex-shrink: 0;
    }

    .input-box {
      margin-top: 24px;
      display: flex;
      align-items: center;
      border: 2px solid var(--primary);
      padding: 8px 14px;
      background: var(--bg);
      width: 100%;
      max-width: 550px;
    }

    .input-prefix {
      font-size: 0.85rem;
      font-weight: 900;
      margin-right: 10px;
    }

    input[type="text"] {
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      width: 100%;
      background: transparent;
      color: var(--primary);
    }

    .target-card {
      margin-top: 20px;
      border: 2px solid var(--primary);
      padding: 16px 20px;
      position: relative;
      width: 100%;
      max-width: 550px;
    }

    .target-card .label {
      position: absolute;
      top: -10px;
      left: 12px;
      background: var(--alert);
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 2px 6px;
    }

    .target-info {
      font-size: 0.75rem;
      line-height: 1.8;
      font-weight: 700;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mouse-tracker {
      position: fixed;
      border: 1px solid var(--primary);
      padding: 4px;
      font-size: 0.55rem;
      font-weight: 800;
      pointer-events: none;
      z-index: 10;
      transform: translate(12px, 12px);
      background: var(--bg);
      white-space: nowrap;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      border-top: 1px solid var(--primary);
      padding-top: 12px;
      z-index: 3;
    }

    .system-logs {
      position: fixed;
      top: 70px;
      right: 24px;
      width: 260px;
      max-height: 60vh;
      overflow: hidden;
      font-size: 0.55rem;
      line-height: 1.8;
      font-weight: 700;
      color: var(--muted);
      pointer-events: none;
      z-index: 2;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .system-logs div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* DESKTOP GRAND ÉCRAN */
    @media (min-width: 1200px) {
      .system-logs {
        width: 300px;
      }
    }

    /* TABLETTE & ÉCRANS MOYENS */
    @media (max-width: 1024px) {
      .system-logs {
        opacity: 0.4;
        width: 200px;
      }
    }

    /* MOBILE ET PETITS ÉCRANS */
    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      header {
        font-size: 0.65rem;
      }

      .header-group {
        gap: 8px;
      }

      .badge {
        font-size: 0.6rem;
        padding: 2px 6px;
      }

      .system-logs {
        display: none;
        /* Masque les logs sur mobile pour libérer l'espace */
      }

      .mouse-tracker {
        display: none;
        /* Desactive le suivi souris sur écran tactile */
      }

      footer {
        font-size: 0.65rem;
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="system-logs" id="system-logs"></div>

  <header>
    <div class="header-group">
      <span>SYS // SAMARITAN OS</span>
      <span class="badge" id="mode-badge">STANDARD MODE</span>
    </div>
    <div class="header-group">
      <span id="node-count">NOTES: 0 EN MÉMOIRE</span>
      <span class="badge" id="lock-badge">DÉVERROUILLÉ</span>
      <span class="badge alert" id="threat-badge">AUCUN MINUTEUR</span>
    </div>
  </header>

  <main>
    <div class="sub-status" id="sub-status">SYSTÈME PRÊT</div>
    <div class="text-display">
      <span id="typewriter"></span><span class="cursor"></span>
    </div>

    <div class="input-box">
      <span class="input-prefix">&gt;</span>
      <input type="text" id="command-input" placeholder="TAPEZ 'HELP'..." autocomplete="off">
    </div>

    <div class="target-card">
      <div class="label" id="card-label">JOURNAL SYSTÈME</div>
      <div class="target-info" id="info-log">EN ATTENTE DE DIRECTIVES...</div>
    </div>
  </main>

  <div class="mouse-tracker" id="tracker">TRACKING: POS(0,0)</div>

  <footer>
    <div>LOCATION: PARIS // 48.8566° N, 2.3522° E</div>
    <div id="clock">00:00:00.000</div>
  </footer>

  <script>
    // ===== Horloge =====
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const ms = String(now.getMilliseconds()).padStart(3, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}.${ms}`;
    }
    setInterval(updateClock, 30);

    // ===== Son synthétisé =====
    let audioCtx = null;
    function playTypeTick() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 700 + Math.random() * 250;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.035);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.035);
      } catch (e) { }
    }

    function playResultSound(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (type === 'success') {
          [520, 780].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const start = audioCtx.currentTime + idx * 0.07;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.08, start + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + 0.13);
          });
        } else if (type === 'error') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch (e) { }
    }

    // ===== Machine à écrire =====
    const typewriter = document.getElementById('typewriter');
    const subStatus = document.getElementById('sub-status');
    let isLocked = false;
    let lockPassword = null;
    let failedAttempts = 0;
    let typewriterRunId = 0;

    function displayText(mainText, statusText = "SORTIE", callback = null, resultType = null) {
      const runId = ++typewriterRunId;
      subStatus.textContent = statusText;
      typewriter.textContent = "";
      let i = 0;
      function type() {
        if (runId !== typewriterRunId) return;
        if (i < mainText.length) {
          const ch = mainText.charAt(i);
          typewriter.textContent += ch;
          if (ch.trim() !== "") playTypeTick();
          i++;
          setTimeout(type, 30);
        } else {
          if (resultType) playResultSound(resultType);
          if (callback) setTimeout(callback, 600);
        }
      }
      type();
    }

    displayText("QUELLES SONT VOS COMMANDES ?");

    document.addEventListener('click', () => { if (audioCtx) audioCtx.resume(); }, { once: true });
    document.addEventListener('keydown', () => { if (audioCtx) audioCtx.resume(); }, { once: true });

    // ===== Suivi de la souris & Télémétrie réels =====
    const tracker = document.getElementById('tracker');
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      tracker.style.left = mouseX + 'px';
      tracker.style.top = mouseY + 'px';
      tracker.textContent = `TRACKING: POS(${mouseX}, ${mouseY})`;
    });

    // ===== État en mémoire =====
    let notes = [];
    let activeTimers = 0;
    const infoLog = document.getElementById('info-log');
    const nodeCount = document.getElementById('node-count');
    const threatBadge = document.getElementById('threat-badge');

    function refreshLog() {
      nodeCount.textContent = `NOTES: ${notes.length} EN MÉMOIRE`;
      if (notes.length === 0) {
        infoLog.textContent = "AUCUNE NOTE ENREGISTRÉE.";
        return;
      }
      infoLog.textContent = notes
        .map((n, idx) => `[${idx + 1}] ${n}`)
        .join('\n');
    }
    refreshLog();

    function setTimerBadge() {
      threatBadge.textContent = activeTimers > 0
        ? `${activeTimers} MINUTEUR(S) ACTIF(S)`
        : "AUCUN MINUTEUR";
    }

    const lockBadge = document.getElementById('lock-badge');
    function setLockBadge() {
      if (isLocked) {
        lockBadge.textContent = "VERROUILLÉ";
        lockBadge.classList.add('alert');
      } else {
        lockBadge.textContent = "DÉVERROUILLÉ";
        lockBadge.classList.remove('alert');
      }
    }
    setLockBadge();

    // ===== VRAIES DONNÉES DE TÉLÉMÉTRIE =====
    const systemLogsEl = document.getElementById('system-logs');
    const MAX_LOG_LINES = 14;

    function appendRealTelemetryLine(text) {
      if (!systemLogsEl) return;
      const line = document.createElement('div');
      line.textContent = text;
      systemLogsEl.appendChild(line);
      while (systemLogsEl.children.length > MAX_LOG_LINES) {
        systemLogsEl.removeChild(systemLogsEl.firstChild);
      }
    }

    // 1. Surveillance de la mémoire JS réelle
    setInterval(() => {
      if (performance && performance.memory) {
        const usedMB = (performance.memory.usedJSHeapSize / 1048576).toFixed(1);
        const limitMB = (performance.memory.jsHeapSizeLimit / 1048576).toFixed(0);
        appendRealTelemetryLine(`RAM USED: ${usedMB}MB / ${limitMB}MB`);
      }
    }, 2500);

    // 2. Coordonnées curseur en continu
    setInterval(() => {
      appendRealTelemetryLine(`CURSOR: X:${mouseX} Y:${mouseY}`);
    }, 1800);

    // 3. Statut de connexion et type de réseau réels
    setInterval(() => {
      const netStatus = navigator.onLine ? "ONLINE" : "OFFLINE";
      const con = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      const type = con ? (con.effectiveType || con.type || "").toUpperCase() : "";
      const rtt = con && con.rtt ? `${con.rtt}MS` : "";
      appendRealTelemetryLine(`NET: ${netStatus} ${type} ${rtt}`.trim());
    }, 3200);

    // 4. Dimensions fenêtre et orientation réelles
    setInterval(() => {
      appendRealTelemetryLine(`VIEWPORT: ${window.innerWidth}X${window.innerHeight}`);
    }, 4000);

    // 5. Statut batterie réel
    if (navigator.getBattery) {
      navigator.getBattery().then(battery => {
        const updateBattery = () => {
          const level = Math.round(battery.level * 100);
          const state = battery.charging ? "CHARGING" : "DISCHARGING";
          appendRealTelemetryLine(`BATTERY: ${level}% (${state})`);
        };
        updateBattery();
        battery.addEventListener('levelchange', updateBattery);
        battery.addEventListener('chargingchange', updateBattery);
      }).catch(() => { });
    }

    // 6. Télémétrie d'événements réseau
    window.addEventListener('online', () => appendRealTelemetryLine("EVENT: NETWORK CONNECTED"));
    window.addEventListener('offline', () => appendRealTelemetryLine("EVENT: NETWORK DISCONNECTED"));

    // 7. Détection du focus
    window.addEventListener('focus', () => appendRealTelemetryLine("WINDOW: FOCUS ACQUIRED"));
    window.addEventListener('blur', () => appendRealTelemetryLine("WINDOW: FOCUS LOST"));

    function safeCalc(expr) {
      const cleaned = expr.replace(/\s+/g, '');
      if (!/^[0-9+\-*/().%]+$/.test(cleaned)) {
        throw new Error("EXPRESSION INVALIDE");
      }
      const result = Function(`"use strict"; return (${cleaned})`)();
      if (typeof result !== 'number' || !isFinite(result)) {
        throw new Error("RÉSULTAT INVALIDE");
      }
      return result;
    }

    // ===== Recherche d'actualités réelles (TRACK) =====
    // Utilise le flux RSS Google News, récupéré via un proxy CORS public
    // car les navigateurs bloquent les requêtes cross-origin directes vers
    // news.google.com. Ce proxy est un service tiers gratuit non garanti :
    // si TRACK échoue, c'est probablement lui qui est indisponible.
    function parseRssXml(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "application/xml");

      const parserError = xmlDoc.querySelector("parsererror");
      if (parserError) {
        throw new Error("FLUX RSS ILLISIBLE");
      }

      const items = Array.from(xmlDoc.querySelectorAll("item")).slice(0, 10);

      return items.map(item => {
        const rawTitle = item.querySelector("title")?.textContent || "TITRE INCONNU";
        // Google News RSS formate souvent "Titre - Source"
        const parts = rawTitle.split(" - ");
        const source = parts.length > 1 ? parts.pop() : "";
        const title = parts.join(" - ");
        const pubDate = item.querySelector("pubDate")?.textContent || "";
        return { title, source, pubDate };
      });
    }

    // Plusieurs stratégies de récupération, essayées dans l'ordre.
    // Ce sont des services tiers gratuits non garantis dans le temps :
    // si l'un change ou tombe en panne, on passe automatiquement au suivant.

    // 1) rss2json.com : service dédié à la conversion RSS -> JSON,
    //    avec en-têtes CORS corrects nativement (pas besoin de proxy générique).
    async function fetchViaRss2Json(rssUrl) {
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error(`RSS2JSON HTTP ${response.status}`);
      const data = await response.json();
      if (data.status !== 'ok' || !Array.isArray(data.items)) {
        throw new Error("RSS2JSON: RÉPONSE INVALIDE");
      }
      return data.items.slice(0, 10).map(item => {
        const rawTitle = item.title || "TITRE INCONNU";
        const parts = rawTitle.split(" - ");
        const source = parts.length > 1 ? parts.pop() : "";
        const title = parts.join(" - ");
        return { title, source, pubDate: item.pubDate || "" };
      });
    }

    // 2) AllOrigins (/get) : proxy CORS générique, renvoie le XML brut en JSON.
    async function fetchViaAllOriginsGet(rssUrl) {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error(`ALLORIGINS HTTP ${response.status}`);
      const data = await response.json();
      if (!data || typeof data.contents !== 'string') {
        throw new Error("ALLORIGINS: RÉPONSE VIDE");
      }
      return parseRssXml(data.contents);
    }

    // 3) corsproxy.io : autre proxy générique, en dernier recours.
    async function fetchViaCorsProxyIo(rssUrl) {
      const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(rssUrl)}`;
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error(`CORSPROXY HTTP ${response.status}`);
      const xmlText = await response.text();
      return parseRssXml(xmlText);
    }

    async function fetchNewsForKeyword(keyword) {
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(keyword)}&hl=fr&gl=FR&ceid=FR:fr`;
      const strategies = [fetchViaRss2Json, fetchViaAllOriginsGet, fetchViaCorsProxyIo];

      let lastError = null;
      for (const strategy of strategies) {
        try {
          const items = await strategy(rssUrl);
          return items; // succès, même si vide (0 résultat pour ce mot-clé)
        } catch (err) {
          lastError = err;
          // on tente la stratégie suivante
        }
      }
      throw lastError || new Error("TOUTES LES SOURCES ONT ÉCHOUÉ");
    }

    function formatNewsList(keyword, results) {
      if (results.length === 0) {
        return `AUCUN RÉSULTAT POUR "${keyword.toUpperCase()}".`;
      }
      return results
        .map((r, idx) => {
          const dateStr = r.pubDate ? new Date(r.pubDate).toLocaleDateString('fr-FR') : '';
          const sourceStr = r.source ? ` [${r.source.toUpperCase()}]` : '';
          const dateSuffix = dateStr ? ` (${dateStr})` : '';
          return `[${idx + 1}] ${r.title.toUpperCase()}${sourceStr}${dateSuffix}`;
        })
        .join('\n');
    }

    async function runTrackCommand(keyword) {
      document.getElementById('card-label').textContent = `ACTUALITÉS : ${keyword.toUpperCase()}`;
      infoLog.textContent = "INTERROGATION DU FLUX EXTERNE...";
      displayText(`RECHERCHE EN COURS : ${keyword.toUpperCase()}`, "TRACK // REQUÊTE RÉSEAU");

      try {
        const results = await fetchNewsForKeyword(keyword);
        infoLog.textContent = formatNewsList(keyword, results);
        displayText(
          results.length
            ? `${results.length} RÉSULTAT(S) TROUVÉ(S).`
            : "AUCUN RÉSULTAT.",
          "TRACK // TERMINÉ",
          null,
          results.length ? 'success' : 'error'
        );
      } catch (err) {
        infoLog.textContent = `ÉCHEC DE LA REQUÊTE : ${err.message || 'ERREUR INCONNUE'}.\nLE SERVICE PROXY EST PEUT-ÊTRE INDISPONIBLE.`;
        displayText("ERREUR RÉSEAU. IMPOSSIBLE DE JOINDRE LA SOURCE.", "TRACK // ÉCHEC", null, 'error');
      }
    }

    // ===== Recherche d'anime (ANIME) =====
    async function fetchAnimeInfoFromAniList(name) {
      const query = `
        query ($search: String) {
          Media(search: $search, type: ANIME) {
            title { romaji english native }
            type
            episodes
            status
            averageScore
            startDate { year }
            genres
            studios(isMain: true) { nodes { name } }
            description(asHtml: false)
            siteUrl
          }
        }`;
      const response = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables: { search: name } })
      });
      if (!response.ok) throw new Error(`ANILIST HTTP ${response.status}`);
      const result = await response.json();
      const anime = result.data && result.data.Media;
      if (!anime) return null;
      return {
        title: anime.title.romaji || anime.title.english || anime.title.native || "TITRE INCONNU",
        titleEn: anime.title.english || "",
        titleJp: anime.title.native || "",
        type: anime.type || "INCONNU",
        episodes: anime.episodes ?? "INCONNU",
        status: anime.status || "INCONNU",
        score: anime.averageScore ? anime.averageScore / 10 : "N/A",
        rank: "N/A",
        year: anime.startDate?.year || "INCONNUE",
        genres: (anime.genres || []).join(", ") || "AUCUN",
        studios: anime.studios?.nodes?.map(studio => studio.name).join(", ") || "INCONNU",
        synopsis: anime.description
          ? anime.description.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '')
          : "AUCUN SYNOPSIS DISPONIBLE.",
        url: anime.siteUrl || ""
      };
    }

    async function translateText(text, targetLanguage) {
      if (!text || targetLanguage === 'en') return text;
      try {
        const translationUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLanguage}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(translationUrl);
        if (!response.ok) throw new Error(`TRADUCTION HTTP ${response.status}`);
        const data = await response.json();
        const translatedText = Array.isArray(data[0])
          ? data[0].map(part => part[0]).join('')
          : '';
        return translatedText || text;
      } catch (error) {
        return text;
      }
    }

    async function translateSynopsisIfNeeded(synopsis) {
      const englishWords = /\b(the|and|this|that|with|from|when|where|only|their|they|must|hero|world)\b/i;
      if (!synopsis || outputLanguage === 'en' || !englishWords.test(synopsis)) return synopsis;
      return translateText(synopsis, outputLanguage);
    }

    function formatAnimeInfo(info) {
      const altTitles = [info.titleEn, info.titleJp].filter(Boolean).join(" / ");
      const lines = [
        `TITRE : ${info.title.toUpperCase()}`,
        altTitles ? `AUSSI CONNU SOUS : ${altTitles.toUpperCase()}` : null,
        `TYPE : ${info.type.toUpperCase()}`,
        `ÉPISODES : ${info.episodes}`,
        `STATUT : ${info.status.toUpperCase()}`,
        `ANNÉE : ${info.year}`,
        `NOTE MAL : ${info.score} (RANG #${info.rank})`,
        `STUDIO(S) : ${info.studios.toUpperCase()}`,
        `GENRES : ${info.genres.toUpperCase()}`,
        info.url ? `LIEN : ${info.url}` : null,
        "",
        "SYNOPSIS :",
        info.synopsis
      ].filter(l => l !== null);
      return lines.join('\n');
    }

    let outputLanguage = 'fr';
    const supportedLanguages = {
      FR: 'fr',
      EN: 'en',
      ES: 'es',
      DE: 'de',
      IT: 'it',
      PT: 'pt'
    };

    async function runAnimeCommand(name) {
      document.getElementById('card-label').textContent = `ANIME : ${name.toUpperCase()}`;
      infoLog.textContent = "INTERROGATION DE LA BASE MYANIMELIST... (NOUVELLE TENTATIVE AUTO SI SURCHARGÉ)";
      displayText(`RECHERCHE : ${name.toUpperCase()}`, "ANIME // REQUÊTE RÉSEAU");

      try {
        const info = await fetchAnimeInfoFromAniList(name);
        if (!info) {
          infoLog.textContent = `AUCUN ANIME TROUVÉ POUR "${name.toUpperCase()}".`;
          displayText("AUCUN RÉSULTAT.", "ANIME // TERMINÉ", null, 'error');
          return;
        }
        info.synopsis = await translateSynopsisIfNeeded(info.synopsis);
        infoLog.textContent = formatAnimeInfo(info);
        displayText(`FICHE TROUVÉE : ${info.title.toUpperCase()}`, "ANIME // TERMINÉ", null, 'success');
      } catch (err) {
        infoLog.textContent = `ÉCHEC DE LA REQUÊTE : ${err.message || 'ERREUR INCONNUE'}.`;
        displayText("ERREUR RÉSEAU. IMPOSSIBLE DE JOINDRE LA SOURCE.", "ANIME // ÉCHEC", null, 'error');
      }
    }

    // ===== Météo, définition et QR code =====
    const weatherLabels = {
      0: "CIEL DÉGAGÉ",
      1: "PRINCIPALEMENT DÉGAGÉ",
      2: "PARTIELLEMENT NUAGEUX",
      3: "COUVERT",
      45: "BROUILLARD",
      48: "BROUILLARD GIVRANT",
      51: "BRUINE LÉGÈRE",
      53: "BRUINE MODÉRÉE",
      55: "BRUINE FORTE",
      61: "PLUIE FAIBLE",
      63: "PLUIE MODÉRÉE",
      65: "FORTE PLUIE",
      71: "NEIGE FAIBLE",
      73: "NEIGE MODÉRÉE",
      75: "FORTE NEIGE",
      80: "AVERSES FAIBLES",
      81: "AVERSES MODÉRÉES",
      82: "FORTES AVERSES",
      95: "ORAGE",
      96: "ORAGE AVEC GRÊLE",
      99: "ORAGE AVEC FORTE GRÊLE"
    };

    async function fetchWeather(city) {
      const normalizeLocationName = value => value
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[-']/g, ' ')
        .replace(/\s+/g, ' ')
        .toLowerCase()
        .trim();
      const normalizedCity = normalizeLocationName(city);
      const searchNames = [...new Set([
        city,
        city.replace(/\s+en\s+/gi, '-en-'),
        city.replace(/\s+/g, '-')
      ])];
      let locations = [];
      for (const searchName of searchNames) {
        const searchUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchName)}&count=10&language=fr&format=json`;
        const searchResponse = await fetch(searchUrl);
        if (!searchResponse.ok) throw new Error(`GÉOCODAGE HTTP ${searchResponse.status}`);
        const searchData = await searchResponse.json();
        locations = searchData.results || [];
        if (locations.length) break;
      }
      const location = locations.find(result => normalizeLocationName(result.name) === normalizedCity)
        || locations[0];
      if (!location) return null;

      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`;
      const weatherResponse = await fetch(weatherUrl);
      if (!weatherResponse.ok) throw new Error(`MÉTÉO HTTP ${weatherResponse.status}`);
      const weatherData = await weatherResponse.json();
      return { location, current: weatherData.current, units: weatherData.current_units };
    }

    function showQrCode(text) {
      infoLog.textContent = "";
      const image = document.createElement('img');
      image.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}`;
      image.alt = `QR CODE : ${text}`;
      image.style.display = 'block';
      image.style.width = '220px';
      image.style.maxWidth = '100%';
      image.style.margin = '0 auto';
      infoLog.appendChild(image);
    }

    // ===== Interpréteur de commandes =====
    const input = document.getElementById('command-input');
    let commandHistory = [];
    let historyIndex = -1;
    let draftBeforeHistory = '';

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const fullCmd = input.value.trim();
        input.value = '';
        historyIndex = -1;
        draftBeforeHistory = '';
        if (!fullCmd) return;

        commandHistory.push(fullCmd);
        appendRealTelemetryLine(`CMD EXEC: ${fullCmd.slice(0, 18).toUpperCase()}`);

        const parts = fullCmd.split(' ');
        const cmd = parts[0].toUpperCase();
        const arg = parts.slice(1).join(' ');

        executeCommand(cmd, arg);
      } else if (e.key === 'ArrowUp') {
        if (commandHistory.length === 0) return;
        e.preventDefault();
        if (historyIndex === -1) {
          draftBeforeHistory = input.value;
          historyIndex = commandHistory.length - 1;
        } else if (historyIndex > 0) {
          historyIndex--;
        }
        input.value = commandHistory[historyIndex];
        input.setSelectionRange(input.value.length, input.value.length);
      } else if (e.key === 'ArrowDown') {
        if (historyIndex === -1) return;
        e.preventDefault();
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          input.value = commandHistory[historyIndex];
        } else {
          historyIndex = -1;
          input.value = draftBeforeHistory;
        }
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });

    function getOSFromUserAgent(ua) {
      if (ua.includes("Win")) return "WINDOWS";
      if (ua.includes("Mac")) return "MACOS";
      if (ua.includes("Linux")) return "LINUX";
      if (ua.includes("Android")) return "ANDROID";
      if (ua.includes("like Mac")) return "IOS";
      return "UNKNOWN_OS";
    }

    function getBrowserFromUserAgent(ua) {
      if (ua.includes("Firefox/")) return "FIREFOX";
      if (ua.includes("Edg/")) return "EDGE";
      if (ua.includes("Chrome/")) return "CHROME";
      if (ua.includes("Safari/")) return "SAFARI";
      return "UNKNOWN_BROWSER";
    }

    function executeCommand(cmd, arg) {
      if (isLocked && cmd !== 'UNLOCK') {
        displayText("SYSTÈME VERROUILLÉ. TAPEZ 'UNLOCK <MOT DE PASSE>'.", "ACCÈS REFUSÉ");
        return;
      }

      switch (cmd) {
        case 'HELP':
          displayText(
            "HELP · WHOAMI · TIME · DATE · CALC · NOTE · NOTES · DELNOTE · TIMER · THEME · LANG · RANDOM · ECHO · TRACK · ANIME · WEATHER · QR · LOCK · UNLOCK · CLEAR",
            "LISTE DES COMMANDES",
            null,
            'success'
          );
          break;

        case 'WHOAMI': {
          const ua = navigator.userAgent;
          const os = getOSFromUserAgent(ua);
          const browser = getBrowserFromUserAgent(ua);
          const lang = (navigator.language || 'INCONNUE').toUpperCase();
          const screenRes = `${window.screen.width}X${window.screen.height}`;
          const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} CORES` : 'INCONNU';
          const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'INCONNUE';
          const online = navigator.onLine ? 'ONLINE' : 'OFFLINE';

          const whoamiData = `SYSTÈME : ${os}
NAVIGATEUR : ${browser}
RÉSOLUTION : ${screenRes}
LANGUE : ${lang}
PROCESSEUR : ${cores}
MÉMOIRE : ${memory}
STATUT RÉSEAU : ${online}`;

          infoLog.textContent = whoamiData;
          document.getElementById('card-label').textContent = "IDENTITÉ SYSTÈME DÉTECTÉE";
          displayText(`SUJET : ${os} // ${browser}`, "IDENTIFICATION DE L'UTILISATEUR", null, 'success');
          break;
        }

        case 'TIME': {
          const now = new Date();
          displayText(now.toLocaleTimeString('fr-FR'), "HEURE ACTUELLE", null, 'success');
          break;
        }

        case 'DATE': {
          const now = new Date();
          displayText(now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }), "DATE ACTUELLE", null, 'success');
          break;
        }

        case 'CALC':
          if (!arg) {
            displayText("ERREUR : FOURNISSEZ UNE EXPRESSION. EX: CALC 12*(3+4)", "ARGUMENT MANQUANT");
          } else {
            try {
              const result = safeCalc(arg);
              displayText(`${arg} = ${result}`, "CALCUL");
            } catch (err) {
              displayText("ERREUR DE CALCUL : EXPRESSION INVALIDE.", "ERREUR");
            }
          }
          break;

        case 'NOTE':
          if (!arg) {
            displayText("ERREUR : ÉCRIVEZ LE TEXTE DE LA NOTE APRÈS 'NOTE'.", "ARGUMENT MANQUANT");
          } else {
            notes.push(arg);
            refreshLog();
            displayText(`NOTE ENREGISTRÉE (#${notes.length}).`, "NOTE AJOUTÉE");
          }
          break;

        case 'NOTES':
          refreshLog();
          displayText(notes.length ? `${notes.length} NOTE(S) EN MÉMOIRE.` : "AUCUNE NOTE.", "NOTES");
          break;

        case 'DELNOTE': {
          const idx = parseInt(arg, 10);
          if (!idx || idx < 1 || idx > notes.length) {
            displayText("ERREUR : NUMÉRO DE NOTE INVALIDE.", "ARGUMENT INVALIDE");
          } else {
            notes.splice(idx - 1, 1);
            refreshLog();
            displayText(`NOTE #${idx} SUPPRIMÉE.`, "NOTE SUPPRIMÉE");
          }
          break;
        }

        case 'TIMER': {
          const seconds = parseInt(arg, 10);
          if (!seconds || seconds <= 0) {
            displayText("ERREUR : INDIQUEZ UNE DURÉE EN SECONDES. EX: TIMER 60", "ARGUMENT INVALIDE");
          } else {
            activeTimers++;
            setTimerBadge();
            displayText(`MINUTEUR LANCÉ : ${seconds}S.`, "MINUTEUR ACTIF");
            setTimeout(() => {
              activeTimers = Math.max(0, activeTimers - 1);
              setTimerBadge();
              displayText(`MINUTEUR DE ${seconds}S TERMINÉ.`, "MINUTEUR EXPIRÉ");
            }, seconds * 1000);
          }
          break;
        }

        case 'THEME': {
          const theme = (arg || '').toUpperCase();
          document.body.classList.remove('theme-red', 'theme-green', 'theme-amber', 'theme-blue');
          const map = { RED: 'theme-red', GREEN: 'theme-green', AMBER: 'theme-amber', BLUE: 'theme-blue' };
          if (theme === 'DEFAULT' || theme === '') {
            displayText("THÈME RÉINITIALISÉ.", "THÈME");
          } else if (map[theme]) {
            document.body.classList.add(map[theme]);
            displayText(`THÈME APPLIQUÉ : ${theme}.`, "THÈME");
          } else {
            displayText("THÈMES DISPONIBLES : DEFAULT, RED, GREEN, AMBER, BLUE.", "THÈME INVALIDE");
          }
          break;
        }

        case 'LANG': {
          const requestedLanguage = (arg || '').trim().toUpperCase();
          if (!supportedLanguages[requestedLanguage]) {
            displayText("LANGUES DISPONIBLES : FR, EN, ES, DE, IT, PT.", "LANGUE INVALIDE", null, 'error');
          } else {
            outputLanguage = supportedLanguages[requestedLanguage];
            displayText(`LANGUE DE SORTIE : ${requestedLanguage}.`, "LANGUE CONFIGURÉE", null, 'success');
          }
          break;
        }

        case 'RANDOM': {
          const nums = arg.split(' ').map(Number);
          const [min, max] = nums.length === 2 && nums.every(n => !isNaN(n)) ? nums : [1, 100];
          const lo = Math.min(min, max), hi = Math.max(min, max);
          const result = Math.floor(Math.random() * (hi - lo + 1)) + lo;
          displayText(`NOMBRE ALÉATOIRE (${lo}-${hi}) : ${result}`, "GÉNÉRATEUR");
          break;
        }

        case 'ECHO':
          displayText(arg || "...", "ÉCHO");
          break;

        case 'TRACK':
          if (!arg) {
            displayText("ERREUR : PRÉCISEZ UN MOT-CLÉ. EX: TRACK ESPACE", "ARGUMENT MANQUANT");
          } else {
            runTrackCommand(arg.trim());
          }
          break;

        case 'ANIME':
          if (!arg) {
            displayText("ERREUR : PRÉCISEZ UN NOM D'ANIME. EX: ANIME NARUTO", "ARGUMENT MANQUANT");
          } else {
            runAnimeCommand(arg.trim());
          }
          break;

        case 'WEATHER':
          if (!arg) {
            displayText("ERREUR : PRÉCISEZ UNE VILLE. EX: WEATHER PARIS", "ARGUMENT MANQUANT");
            break;
          }
          infoLog.textContent = "INTERROGATION DU SERVICE MÉTÉO...";
          document.getElementById('card-label').textContent = `MÉTÉO : ${arg.toUpperCase()}`;
          displayText(`RECHERCHE MÉTÉO : ${arg.toUpperCase()}`, "WEATHER // REQUÊTE RÉSEAU");
          fetchWeather(arg.trim()).then(result => {
            if (!result) {
              infoLog.textContent = `VILLE INTROUVABLE : ${arg.toUpperCase()}.`;
              displayText("AUCUNE LOCALISATION TROUVÉE.", "WEATHER // ÉCHEC", null, 'error');
              return;
            }
            const { location, current, units } = result;
            infoLog.textContent = `VILLE : ${location.name.toUpperCase()} (${location.country_code})\nCONDITION : ${weatherLabels[current.weather_code] || "INCONNUE"}\nTEMPÉRATURE : ${current.temperature_2m}${units.temperature_2m}\nHUMIDITÉ : ${current.relative_humidity_2m}${units.relative_humidity_2m}\nVENT : ${current.wind_speed_10m}${units.wind_speed_10m}`;
            displayText(`MÉTÉO : ${location.name.toUpperCase()} // ${current.temperature_2m}${units.temperature_2m}`, "WEATHER // TERMINÉ", null, 'success');
          }).catch(error => {
            infoLog.textContent = `ÉCHEC DE LA REQUÊTE : ${error.message || 'ERREUR INCONNUE'}.`;
            displayText("ERREUR RÉSEAU. MÉTÉO INDISPONIBLE.", "WEATHER // ÉCHEC", null, 'error');
          });
          break;

        case 'QR':
          if (!arg) {
            displayText("ERREUR : PRÉCISEZ UN TEXTE OU UN LIEN. EX: QR HTTPS://EXEMPLE.COM", "ARGUMENT MANQUANT");
          } else {
            document.getElementById('card-label').textContent = "QR CODE GÉNÉRÉ";
            showQrCode(arg.trim());
            displayText("QR CODE PRÊT À ÊTRE SCANNÉ.", "QR // TERMINÉ", null, 'success');
          }
          break;

        case 'LOCK': {
          const pwd = (arg || '').trim();
          if (!pwd) {
            displayText("ERREUR : DÉFINISSEZ UN MOT DE PASSE. EX: LOCK 1234", "ARGUMENT MANQUANT");
          } else {
            isLocked = true;
            lockPassword = pwd;
            setLockBadge();
            displayText("SYSTÈME VERROUILLÉ PAR L'OPÉRATEUR.", "VERROU DE SÉCURITÉ");
          }
          break;
        }

        case 'UNLOCK': {
          if (!isLocked) {
            displayText("LE SYSTÈME N'EST PAS VERROUILLÉ.", "AUCUNE ACTION");
            break;
          }
          const attempt = (arg || '').trim();
          if (!attempt) {
            displayText("ERREUR : SAISISSEZ LE MOT DE PASSE. EX: UNLOCK 1234", "MOT DE PASSE REQUIS");
          } else if (attempt === lockPassword) {
            failedAttempts = 0;
            isLocked = false;
            lockPassword = null;
            setLockBadge();
            displayText("SYSTÈME DÉVERROUILLÉ.", "ACCÈS AUTORISÉ");
          } else {
            failedAttempts++;
            displayText(`MOT DE PASSE INCORRECT. TENTATIVE ${failedAttempts}.`, "ACCÈS REFUSÉ");
          }
          break;
        }

        case 'CLEAR':
          notes = [];
          document.getElementById('card-label').textContent = "JOURNAL SYSTÈME";
          refreshLog();
          displayText("QUELLES SONT VOS COMMANDES ?");
          break;

        default:
          displayText(`DIRECTIVE INCONNUE : "${cmd}". TAPEZ 'HELP'.`, "ERREUR");
          break;
      }
    }
  </script>

</body>
